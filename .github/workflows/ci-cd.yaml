name: CI-CD

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: serverless-event-platform

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff pytest

      - name: Lint
        run: ruff check .

      # Keep this only when you actually have tests
      # - name: Test
      #   run: pytest

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Terraform must exist BEFORE we use terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: infra/terraform
        run: terraform init

      # Bootstrap ECR so Docker has somewhere to push
      - name: Ensure ECR repository exists
        working-directory: infra/terraform
        run: |
          terraform apply \
            -target=aws_ecr_repository.lambda \
            -auto-approve \
            -var="image_tag=bootstrap"

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Lambda images
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Handler
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:handler-$IMAGE_TAG \
            services/handler

          docker push \
            $ECR_REGISTRY/$ECR_REPOSITORY:handler-$IMAGE_TAG


          # Object worker
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:object-worker-$IMAGE_TAG \
            services/object_worker

          docker push \
            $ECR_REGISTRY/$ECR_REPOSITORY:object-worker-$IMAGE_TAG


          # Metadata worker
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:metadata-worker-$IMAGE_TAG \
            services/metadata_worker

          docker push \
            $ECR_REGISTRY/$ECR_REPOSITORY:metadata-worker-$IMAGE_TAG

      - name: Terraform Apply
        working-directory: infra/terraform
        run: |
          terraform apply \
            -auto-approve \
            -var="image_tag=${{ github.sha }}"